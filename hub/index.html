<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Performance Hub — Goettl LV (Power BI weekly)</title>
<style>
:root{
 --db:#003963;--nv:#000426;--mb:#3678A0;--lb:#77B2D0;--red:#CD1E1F;
 --grad:linear-gradient(135deg,#77B2D0 0%,#3678A0 50%,#003963 100%);
 --g:#2D7A47;--g-bg:#E6F0E9;--a:#B45309;--a-bg:#FBEEDC;--r:#CD1E1F;--r-bg:#FBE2E2;--n:#3678A0;--n-bg:#EAF2F8;
 --ink:#1b2733;--mut:#5c6b7a;--line:#dbe3ea;--bg:#f4f7fa;--card:#fff;--shadow:0 2px 8px rgba(0,57,99,.08);
}
@media (prefers-color-scheme: dark){ :root{ --bg:#f4f7fa; } }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Montserrat,"Segoe UI",Roboto,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.4}
header{background:var(--grad);color:#fff;border-bottom:4px solid var(--red)}
.hd{max-width:1200px;margin:0 auto;padding:16px 18px 12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;flex:1 1 auto}
.logo{background:#fff;color:var(--db);font-weight:800;letter-spacing:.06em;border-radius:9px;padding:9px 11px;font-size:15px;box-shadow:0 1px 4px rgba(0,0,0,.22)}
.logo span{color:var(--red)}
.brand h1{font-size:21px;font-weight:700;letter-spacing:.01em}
.brand .sub{font-size:12px;opacity:.9;margin-top:2px}
.seg{display:inline-flex;background:rgba(255,255,255,.16);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:#fff;font:inherit;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer}
.seg button.on{background:#fff;color:var(--db)}
.ctrls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ctrls .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.85;margin-inline-end:4px}
nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;box-shadow:var(--shadow)}
.vnav{max-width:1200px;margin:0 auto;display:flex;gap:4px;padding:0 12px;overflow-x:auto}
.vnav button{border:0;background:none;font:inherit;font-weight:600;color:var(--mut);padding:12px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.vnav button.on{color:var(--db);border-bottom-color:var(--red)}
.vnav .n{display:inline-block;background:var(--n-bg);color:var(--db);border-radius:10px;font-size:11px;padding:1px 7px;margin-inline-start:4px}
main{max-width:1200px;margin:0 auto;padding:18px}
.pane{display:none;animation:fade .35s ease}
.pane.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.sec .tk{width:5px;height:20px;background:var(--red);border-radius:3px}
.sec .tt{font-weight:700;font-size:15.5px;color:var(--db)}
.sec .wtag{font-size:11px;font-weight:700;background:var(--n-bg);color:var(--db);padding:2px 8px;border-radius:10px}
.sec .hint{font-size:12px;color:var(--mut);margin-inline-start:auto}
.card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.pace{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.pc{overflow:hidden}
.pc .top{height:5px}
.pc .bd{padding:12px 14px}
.pc .lb{font-size:11.5px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.pc .v{font-size:26px;font-weight:800;color:var(--db);margin:4px 0}
.pc .ft{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut);gap:6px;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap}
.bg-g{background:var(--g)} .bg-a{background:#D97706} .bg-r{background:var(--r)} .bg-n{background:var(--mb)}
.c-g{background:var(--g-bg);color:var(--g)} .c-a{background:var(--a-bg);color:var(--a)} .c-r{background:var(--r-bg);color:var(--r)} .c-n{background:var(--n-bg);color:var(--n)}
.t-g{color:var(--g)} .t-a{color:var(--a)} .t-r{color:var(--r)} .t-n{color:var(--n)}
.bars{padding:6px 14px}
.bar{display:grid;grid-template-columns:230px 1fr 64px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.bar:last-child{border-bottom:0}
.bar .l1{font-weight:700;font-size:13px}
.bar .l2{font-size:12px;color:var(--mut)}
.trk{height:12px;background:#eef2f6;border-radius:8px;overflow:hidden}
.fl{height:100%;border-radius:8px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.bar .r{text-align:end}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.box{padding:12px 14px}
.box .lb{font-size:11.5px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.box .big{font-size:26px;font-weight:800;margin-top:2px}
.box .smt{font-size:12px;color:var(--mut);font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);text-align:start;padding:8px 10px;border-bottom:2px solid var(--line);background:#fafcfd}
td{padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px}
td.num,th.num{text-align:end}
.gpill{display:inline-block;min-width:58px;text-align:center;font-weight:700;font-size:12.5px;padding:3px 8px;border-radius:9px}
.tbox .hd2{padding:10px 14px;font-weight:700;color:var(--db);border-bottom:1px solid var(--line)}
/* KPI trend tiles */
.cat{margin:18px 0 8px;font-weight:800;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mb);display:flex;align-items:center;gap:8px}
.cat:after{content:"";flex:1;height:1px;background:var(--line)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{position:relative;padding:12px 14px 10px;border-radius:12px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;animation:rise .5s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tile:before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:5px;background:var(--mb)}
.tile.s-green:before{background:var(--g)} .tile.s-amber:before{background:#D97706} .tile.s-red:before{background:var(--r)}
.tile .t1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tile .nm{font-weight:700;font-size:13px;color:var(--db)}
.tile .val{font-size:27px;font-weight:800;margin:4px 0 2px;letter-spacing:-.01em}
.tile .val small{font-size:13px;font-weight:600;color:var(--mut);margin-inline-start:3px}
.tile .row{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--mut);flex-wrap:wrap}
.wow{font-weight:700;font-size:11.5px;padding:2px 7px;border-radius:9px}
.wow.up{background:var(--g-bg);color:var(--g)} .wow.down{background:var(--r-bg);color:var(--r)} .wow.flat{background:#eef2f6;color:var(--mut)}
.tdown{position:absolute;top:10px;inset-inline-end:10px}
.spark{width:100%;height:92px;display:block;margin-top:4px}
.spark .ln{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:700;stroke-dashoffset:0;animation:draw 1.2s ease both}
@keyframes draw{from{stroke-dashoffset:700}to{stroke-dashoffset:0}}
.spark .ar{animation:fadein .8s .5s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.spark .tg{stroke:#9aa9b6;stroke-dasharray:4 4;stroke-width:1.3}
.spark text{font-size:9.5px;fill:#7b8a97;font-family:inherit}
.spark .pt{animation:fadein .4s 1s ease both}
.note{font-size:11px;color:var(--mut);margin-top:3px;font-style:italic}
.tdbox{padding:12px 14px;border-inline-start:5px solid var(--r)}
.tdbox h3{font-size:13.5px;color:var(--r);margin-bottom:6px}
.tdlist{display:flex;flex-wrap:wrap;gap:6px}
.tdlist span{background:var(--r-bg);color:var(--r);font-weight:600;font-size:12px;padding:3px 9px;border-radius:9px}
/* heat map */
.heat td.hc{text-align:center;font-weight:700}
.heat tr.sec-row td{background:var(--n-bg);color:var(--db);font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.heat tr.smrow{cursor:pointer}
.heat tr.smrow:hover td{background:#f6fafd}
.heat small{display:block;color:var(--mut);font-weight:500;font-size:11px}
.h-g{background:var(--g-bg);color:var(--g)} .h-a{background:var(--a-bg);color:var(--a)} .h-r{background:var(--r-bg);color:var(--r)} .h-n{color:var(--mut)}
/* tech */
.picker{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 14px}
.picker select,.picker input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;min-width:210px}
.picker button{font:inherit;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--db);border-radius:9px;padding:8px 12px;cursor:pointer}
.prof{display:flex;align-items:center;gap:14px;padding:14px}
.av{width:56px;height:56px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;flex:0 0 auto}
.prof h2{font-size:20px;color:var(--db)}
.prof .meta{color:var(--mut);font-size:12.5px}
.prof .kp{margin-inline-start:auto;display:flex;gap:18px;flex-wrap:wrap}
.prof .kp div{text-align:center}
.prof .kp b{display:block;font-size:20px;color:var(--db)}
.prof .kp span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px}
.st{padding:10px 12px;border-radius:11px;background:#fff;border:1px solid var(--line);position:relative;overflow:hidden;animation:rise .4s ease both}
.st .wins{display:flex;gap:10px;font-size:11px;color:var(--mut);margin-top:3px}
.st .wins b{color:var(--ink);font-weight:700}
.st .wins .on b{color:var(--db);text-decoration:underline}
@media (prefers-reduced-motion: reduce){.tile,.st,.spark .ln,.spark .ar,.spark .pt,.pane{animation:none}}
.st:before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--mb)}
.st.s-green:before{background:var(--g)} .st.s-amber:before{background:#D97706} .st.s-red:before{background:var(--r)} .st.s-neutral:before{background:#c4ced8}
.st .nm{font-size:11.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.st .v{font-size:21px;font-weight:800;margin:2px 0}
.st .ref{font-size:11.5px;color:var(--mut);display:flex;justify-content:space-between;gap:6px}
.st svg{width:100%;height:34px;display:block;margin-top:4px}
.st svg polyline{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--db);border-radius:14px;padding:4px 10px;cursor:pointer}
.chips button.on{background:var(--db);color:#fff;border-color:var(--db)}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;padding:12px 14px}
.roster h4{font-size:12px;color:var(--mb);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.roster button{display:block;border:0;background:none;font:inherit;color:var(--ink);padding:3px 0;cursor:pointer;text-align:start}
.roster button:hover,.roster button.on{color:var(--red);font-weight:700}
.empty{padding:30px;text-align:center;color:var(--mut)}
/* watch */
.wl td.cell{text-align:center;font-weight:700}
.notes{padding:16px 18px}
.notes h4{color:var(--db);margin:10px 0 6px}
.notes li{margin:4px 0 4px 18px;font-size:13px}
.notes table td,.notes table th{font-size:12.5px}
footer{max-width:1200px;margin:10px auto 30px;padding:0 18px;color:var(--mut);font-size:11.5px}
a{color:var(--mb)}
@media (max-width:700px){.bar{grid-template-columns:1fr}.bar .r{text-align:start}.prof{flex-wrap:wrap}}
@media print{nav,.ctrls{display:none}.pane{display:block!important}.tile,.st{opacity:1;animation:none}}
</style>
</head>

 else add('Sales by Job Group',{nm:'Water purity $',v:V(X.ch('WP')),kind:'usd',ref:trdT(X.ch('WP'),'usd'),series:ser(X.ch('WP'))});
 add('Sales by Job Group',{nm:'Estimates per completed job',v:V(X.est),kind:'dec',ref:trd(X.est,'dec'),series:ser(X.est)});
 add('Sales by Job Group',{nm:'Sales discount rate',v:V(X.disc),kind:'pct',ref:trd(X.disc,'pct'),series:ser(X.disc)});
 add('Sales by Job Group',{nm:'Invoice discount rate',v:V(X.invDisc),kind:'pct',ref:trd(X.invDisc,'pct'),series:ser(X.invDisc)});
 const cbp=X.cbPct(r);
 add('Quality',{nm:'Callback jobs run',v:V(X.cbPct),kind:'pct',st:st(cbp,G.cbk,'lower'),goal:fN(X.cb(r))+' callbacks · goal ≤ '+G.cbk+'%',ref:trd(X.cbPct,'pct'),series:ser(X.cbPct),low:jobs<10&&jobs?'Fewer than 10 jobs — not scored':''});
 add('Quality',{nm:'Recalls caused (last 12 months)',v:V(X.recall),kind:'pct',goal:fN(X.recallN(r))+' recalls',ref:trd(X.recall,'pct')});
 if(tr==='HVAC')MQB.forEach(([b,n])=>{const v=X.mq(b)(r),j=X.mqJobs(b)(r);add('Quality',{nm:'MeasureQuick — '+n,v:V(X.mq(b)),kind:'pct',st:st(v,G.mq[b],'higher'),goal:fN(j)+' jobs · goal '+G.mq[b]+'%',ref:trd(X.mq(b),'pct'),series:ser(X.mq(b)),low:!j&&jobs?'No '+n.toLowerCase()+' jobs in window':''});});
 else add('Quality',{nm:'Water purity test usage',v:V(X.wpt),kind:'pct',ref:trd(X.wpt,'pct'),series:ser(X.wpt)});
 add('Job Mix',{nm:'Jobs completed',v:V(X.jobs),kind:'count',ref:trdT(X.jobs,'count'),series:ser(X.jobs)});
 add('Job Mix',{nm:'Demand jobs',v:V(X.jD),kind:'count',series:ser(X.jD)});
 add('Job Mix',{nm:'Maintenance opportunities',v:V(X.opps('M')),kind:'count',series:ser(X.opps('M'))});
 add('Job Mix',{nm:'Install jobs',v:V(X.jIns),kind:'count',series:ser(X.jIns)});
 add('Job Mix',{nm:'Non-revenue jobs',v:V(X.jNR),kind:'count',series:ser(X.jNR)});
 let i=0;Object.keys(C).forEach(cat=>{h+=`<div class="cat">${cat}</div><div class="stats">${C[cat].map(c=>statCard(c,i++)).join('')}</div>`;});
 h+=`<div class="note" style="margin-top:10px">Every card shows the selected window large, with 7D · 28D · MTD underneath. A "—" means there were no qualifying jobs or opportunities in that window (for example, no retail calls that week). Mini-lines = the 5 weekly windows (${M.weekEnds.join(' · ')}). Same Power BI measures as the Technician Scorecard and Service Manager Dashboard; "Trade" = ${tr} rate for the same window. Volume rules follow the hub (3+ jobs for lateness, 10+ jobs for reviews and callbacks, 3+ opportunities for close rate).</div>`;
 P.innerHTML=h;wireTech();}
function wireTech(){const ss=$('smSel'),ts=$('techSel'),q=$('techSearch');
 if(ss)ss.addEventListener('change',()=>{S.smFilter=ss.value;S.tech=null;renderTech();});
 if(ts)ts.addEventListener('change',()=>{S.tech=+ts.value;renderTech();});
 const pool=techPool();const step=d=>{const ix=pool.findIndex(t=>t.id===S.tech);if(!pool.length)return;S.tech=pool[(ix+d+pool.length)%pool.length].id;renderTech();};
 if($('prevT'))$('prevT').addEventListener('click',()=>step(-1));if($('nextT'))$('nextT').addEventListener('click',()=>step(1));
 if(q)q.addEventListener('keydown',e=>{if(e.key==='Enter'){const v=q.value.trim().toLowerCase();if(!v)return;const m=D.techs.find(t=>t.name.toLowerCase().includes(v));if(m){S.scope=S.scope==='Branch'||S.scope===m.tr?S.scope:'Branch';S.smFilter='All';S.tech=m.id;syncSeg();renderTech();}}});}
/* ---------- Watch List (team-level, no names) ---------- */
const WK=[
 {k:'On-Time (mins late)',val:r=>X.jobs(r)>=3?X.late(r):null,ok:(v)=>v<=15},
 {k:'Driving (Samsara)',val:r=>X.jobs(r)>0?X.sam(r):null,ok:v=>v>=90},
 {k:'% Jobs Reviewed',val:r=>X.jobs(r)>=10?X.pctRev(r):null,ok:(v,tr)=>v>=G.jobsRev[tr]},
 {k:'Membership Conversion',val:r=>X.memOpps(r)>=1?X.memConv(r):null,ok:(v,tr)=>v>=G.memConv[tr]},
 {k:'Demand Close',val:r=>X.opps('D')(r)>=3?X.close('D')(r):null,ok:(v,tr)=>v>=G.dmdSM[tr]},
 {k:'Callback-free',val:r=>X.jobs(r)>=10?X.cb(r):null,ok:v=>v===0},
 {k:'No 1-star reviews',val:r=>X.jobs(r)>0?X.one(r):null,ok:v=>v===0}];
function renderWatch(){const w=S.win;const trs=S.scope==='Branch'?['HVAC','Plumbing']:[S.scope];
 let h=`<div class="sec"><span class="tk"></span><span class="tt">Watch List — where coaching need concentrates</span><span class="wtag">${WNAME[w]} · ${M.rng[w]}</span></div><div class="note" style="margin-bottom:8px">Counts of technicians not at the hub goal for each KPI, by team (minimum-volume rules apply). Pick a technician on the Technicians tab to see their detail.</div>`;
 trs.forEach(tr=>{const sms=SMS.filter(s=>D.smTrade[s]===tr);h+=`<div class="card" style="margin-bottom:12px"><table class="wl"><thead><tr><th>${tr} KPI</th>${sms.map(s=>'<th class="num">'+esc(s)+'</th>').join('')}<th class="num">${tr} total</th></tr></thead><tbody>`;
  WK.forEach(K=>{let row=`<tr><td><b>${K.k}</b></td>`;let TN=0,TM=0;sms.concat(['__T']).forEach(s=>{let n=0,m=0;D.techs.filter(t=>t.tr===tr&&(s==='__T'||t.sm===s)).forEach(t=>{const v=K.val((t.w||{})[w]);if(v!=null){m++;if(!K.ok(v,tr))n++;}});
   const sh=m?n/m:null;const c=sh==null?'n':sh>=0.5?'r':sh>=0.25?'a':'g';row+=`<td class="cell"><span class="gpill c-${c}">${m?n+' / '+m:'—'}</span></td>`;});h+=row+'</tr>';});
  h+='</tbody></table></div>';});
 $('pane-watch').innerHTML=h;}
/* ---------- Notes ---------- */
function renderNotes(){const g=G;const row=(a,b,c,d)=>`<tr><td>${a}</td><td class="num">${b}</td><td class="num">${c}</td><td class="num">${d}</td></tr>`;
 $('pane-notes').innerHTML=`<div class="card notes"><h4>Goals in use — ${esc(g.source)}${g.missing?' (month column not found: hub defaults shown)':''}</h4>
 <table><tr><th>Goal</th><th class="num">Branch</th><th class="num">HVAC</th><th class="num">Plumbing</th></tr>
 ${row('Revenue budget ('+g.month+')',f$(g.rev.Branch),f$(g.rev.HVAC),f$(g.rev.Plumbing))}${row('Channel sales goal',f$(g.chan.Branch),f$(g.chan.HVAC),f$(g.chan.Plumbing)+' (water purity)')}
 ${row('% jobs reviewed',g.jobsRev.Branch+'%',g.jobsRev.HVAC+'%',g.jobsRev.Plumbing+'%')}${row('Membership conversion',g.memConv.Branch+'%',g.memConv.HVAC+'%',g.memConv.Plumbing+'%')}
 ${row('Memberships converted / month',fN(g.memMonth),'split by job share','split by job share')}${row('Reviews / month',fN(g.revwMonth),'split by job share','split by job share')}
 ${row('Gross margin % (monthly GL)',fN(g.gm.Branch,1)+'%',fN(g.gm.HVAC,1)+'%',fN(g.gm.Plumbing,1)+'%')}${row('Contribution profit % (monthly GL)',fN(g.contrib.Branch,1)+'%',fN(g.contrib.HVAC,1)+'%',fN(g.contrib.Plumbing,1)+'%')}
 ${row('MeasureQuick (HVAC)','','D '+g.mq.D+' · M '+g.mq.M+' · Inst '+g.mq.INS+' · CB '+g.mq.CB+' · War '+g.mq.WAR,'')}</table>
 <h4>Goals carried from the Performance Hub (not in Yearly Goals.xlsx)</h4><ul><li>Mins late ≤ ${g.late}; drive time ≤ ${g.drive} min; Samsara ≥ ${g.sam}; callback % ≤ ${g.cbk}% (KPI Trend) and ≤ 15% heat-map band.</li>
 <li>Close rate — HVAC: Demand ${g.close.HVAC.D}%, Maintenance ${g.close.HVAC.M}%, Retail ${g.close.HVAC.R}%; Plumbing: Demand ${g.close.Plumbing.D}%, Maintenance ${g.close.Plumbing.M}%, Retail ${g.close.Plumbing.R}%, Drain ${g.close.Plumbing.Dr}%. Service Manager demand-close targets HVAC ${g.dmdSM.HVAC}% / Plumbing ${g.dmdSM.Plumbing}%.</li>
 <li>Average sale — HVAC: Demand ${f$(g.avg.HVAC.D)}, Maintenance ${f$(g.avg.HVAC.M)}, Retail ${f$(g.avg.HVAC.R)}; Plumbing: Demand ${f$(g.avg.Plumbing.D)}, Maintenance ${f$(g.avg.Plumbing.M)}, Retail ${f$(g.avg.Plumbing.R)}, Drain ${f$(g.avg.Plumbing.Dr)}.</li></ul>
 <h4>How the numbers are built</h4><ul>
 <li>Source: Power BI semantic model "Core Model" (GEL Fabric PRD) — the model behind the Technician Scorecard and Budget Assumption Tracker. Data through ${M.endLabel}.</li>
 <li>Weekly windows: ${WKS.map(k=>M.rng[k]).join(' · ')}. Trailing 28 = ${M.rng.T28}. MTD = ${M.rng.MTD}.</li>
 <li>Pace: revenue, memberships, reviews and jobs prorated over ${M.wd_e} of ${M.wd_m} working days; channel over ${M.cal_e} of ${M.cal_m} calendar days. Revenue and jobs exclude the Budget Assumption Tracker's QCI/permit/drywall job types.</li>
 <li>Technician pool: active Las Vegas technicians (service managers excluded) whose current Service Manager is one of the 8 hub teams. Weekly targets = monthly goal × 7/30.</li>
 <li>Differences from the original hub: drive time uses Power BI timesheet drive time (runs ~3–5 min higher than the hub's Samsara drive seconds); membership conversion uses Power BI membership opportunities (the hub's Vitals bar uses the 30-day ServiceTitan report); callbacks = callback job types completed; Samsara score is monthly.</li>
 <li>Trending down = more than 10% worse than the prior week or the prior 4-week average (a rise is worse for lateness, drive time, callbacks and 1-star reviews).</li></ul>
 <h4>Power BI reports</h4><ul><li><a href="${D.links.scorecard}" target="_blank" rel="noopener">Technician Scorecard</a></li><li><a href="${D.links.budget}" target="_blank" rel="noopener">Budget Assumption Tracker</a></li></ul></div>`;}
/* ---------- wiring ---------- */
function animateBars(){requestAnimationFrame(()=>document.querySelectorAll('.fl[data-w]').forEach(el=>{el.style.width=el.getAttribute('data-w')+'%';}));}
function render(){$('subline').textContent=`${S.scope} · ${WNAME[S.win]} ${M.rng[S.win]} · data through ${M.endLabel} · built ${M.built}`;
 $('nSM').textContent=SMS.filter(s=>S.scope==='Branch'||D.smTrade[s]===S.scope).length;$('nTech').textContent=D.techs.filter(t=>S.scope==='Branch'||t.tr===S.scope).length;
 ({vitals:renderVitals,trend:renderTrend,sm:renderSM,tech:renderTech,watch:renderWatch,notes:renderNotes})[S.pane]();animateBars();}
function show(p){S.pane=p;document.querySelectorAll('.pane').forEach(e=>e.classList.toggle('on',e.id==='pane-'+p));document.querySelectorAll('#vnav button').forEach(b=>b.classList.toggle('on',b.getAttribute('data-p')===p));render();window.scrollTo({top:0,behavior:'smooth'});}
function syncSeg(){document.querySelectorAll('#scopeSeg button').forEach(b=>b.classList.toggle('on',b.getAttribute('data-s')===S.scope));document.querySelectorAll('#winSeg button').forEach(b=>b.classList.toggle('on',b.getAttribute('data-w')===S.win));}
document.querySelectorAll('#vnav button').forEach(b=>b.addEventListener('click',()=>show(b.getAttribute('data-p'))));
document.querySelectorAll('#scopeSeg button').forEach(b=>b.addEventListener('click',()=>{S.scope=b.getAttribute('data-s');S.smFilter='All';syncSeg();render();}));
document.querySelectorAll('#winSeg button').forEach(b=>b.addEventListener('click',()=>{S.win=b.getAttribute('data-w');syncSeg();render();}));
$('foot').innerHTML=`Source: Power BI Core Model (GEL Fabric PRD) · Goals: ${esc(G.source)} · Goettl Air Conditioning &amp; Plumbing — Las Vegas Branch · <i>We Do Things The Right Way, Not The Easy Way.®</i>`;
render();
</script>
