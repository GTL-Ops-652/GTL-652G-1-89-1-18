<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goettl SM Job Runner</title>
<style>
:root{
  --dark-blue:#003963; --navy:#000426; --med-blue:#3678A0; --light-blue:#77B2D0;
  --red:#CD1E1F; --gray:#C0B8B6; --white:#FFFFFF;
  --grad:linear-gradient(135deg,#77B2D0 0%,#3678A0 50%,#003963 100%);
  --shadow:0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
html{width:100%}
body{font-family:'Montserrat',-apple-system,'Segoe UI',sans-serif;background:var(--navy);color:var(--white);min-height:100vh;padding:16px;width:100%;display:flex;flex-direction:column;align-items:center}
.wrap{width:100%;max-width:780px}
.card{background:var(--white);color:var(--dark-blue);border-radius:16px;box-shadow:var(--shadow);padding:24px;margin-top:16px;overflow:hidden}
h1{font-family:Georgia,serif;font-size:30px;letter-spacing:-.5px}
h2{font-family:Georgia,serif;font-size:22px;margin-bottom:8px}
h3{font-size:15px;text-transform:uppercase;letter-spacing:1px;color:var(--med-blue);margin:14px 0 6px}
p{line-height:1.45;margin-bottom:8px}
.hero{background:var(--grad);color:#fff;border-radius:16px;padding:28px;text-align:center}
.hero p{opacity:.95}
.sub{font-size:13px;opacity:.85}
.btn{display:block;width:100%;background:var(--dark-blue);color:#fff;border:2px solid var(--dark-blue);padding:14px 16px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-top:10px;text-align:left;transition:.12s}
.btn:hover{background:#fff;color:var(--dark-blue)}
.btn.center{text-align:center}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.red:hover{background:#fff;color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.optrow{display:flex;align-items:center;gap:10px;border:2px solid #dfe7ee;border-radius:10px;padding:12px 14px;margin-top:10px;cursor:pointer;transition:.12s;font-weight:600;font-size:14px}
.optrow:hover{border-color:var(--med-blue)}
.optrow.on{border-color:var(--dark-blue);background:#eef5fa}
.optrow .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--med-blue);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.optrow.on .box{background:var(--dark-blue);border-color:var(--dark-blue)}
.optrow.on .box::after{content:"✓"}
.optrow .tier{margin-left:auto;font-size:12px;color:var(--med-blue);font-weight:700;white-space:nowrap}
.client{background:#fff4f4;border-left:4px solid var(--red);border-radius:8px;padding:12px 14px;margin:10px 0}
.client b{color:var(--red)}
.feedback{border-radius:8px;padding:12px 14px;margin:10px 0;font-weight:600}
.feedback.good{background:#e6f4ea;color:#1a7a3a;border-left:4px solid #1a7a3a}
.feedback.bad{background:#fdecea;color:#b3261e;border-left:4px solid var(--red)}
.feedback.warn{background:#fff7e6;color:#9a6700;border-left:4px solid #d9a200}
.feedback.info{background:#eef5fa;color:#2a5f86;border-left:4px solid var(--med-blue)}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.stat{background:#f2f6f9;border-radius:10px;padding:14px;text-align:center}
.stat .n{font-family:Georgia,serif;font-size:24px;color:var(--dark-blue)}
.stat .l{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--med-blue);margin-top:2px}
.progress{height:8px;background:#dfe7ee;border-radius:999px;overflow:hidden;margin:14px 0}
.progress>div{height:100%;background:var(--grad);transition:.3s}
.muted{font-size:12px;color:var(--med-blue)}
.center{text-align:center}
.foot{text-align:center;font-size:11px;opacity:.6;margin-top:18px;max-width:780px;width:100%}
.soundtoggle{position:fixed;top:12px;right:14px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;z-index:10}
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--gray);color:var(--navy);display:inline-block}
.booking{background:var(--navy);color:#fff;border-radius:10px;padding:14px 16px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.booking .lbl{font-size:11px;text-transform:uppercase;letter-spacing:1px;opacity:.7}
.booking .bk{font-family:Georgia,serif;font-size:17px}
.win{color:#1a7a3a} .lose{color:var(--red)}
.legend{font-size:12px;background:#f2f6f9;border-radius:8px;padding:10px 12px;margin-top:8px;line-height:1.5}
.legend b{color:var(--dark-blue)}
</style>
</head>
<body>
<button class="soundtoggle" id="soundBtn" onclick="toggleSound()">🔊 Sound On</button>
<div class="wrap" id="app"></div>
<div class="foot">Goettl Air Conditioning &amp; Plumbing — SM Training. We Do Things The Right Way, Not The Easy Way.®</div>

<script>
/* ---------------- SOUND ---------------- */
let actx=null, soundOn=true;
function AC(){if(!actx){actx=new(window.AudioContext||window.webkitAudioContext)();}return actx;}
function tone(f,d,t='sine',v=.15,dl=0){if(!soundOn)return;const c=AC(),o=c.createOscillator(),g=c.createGain();o.type=t;o.frequency.value=f;o.connect(g);g.connect(c.destination);const s=c.currentTime+dl;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.start(s);o.stop(s+d+.02);}
const SFX={
 click:()=>tone(420,.08,'triangle',.12),
 good:()=>{tone(660,.1,'sine',.15);tone(880,.14,'sine',.13,.09);},
 close:()=>{tone(523,.12,'sine',.16);tone(659,.12,'sine',.16,.1);tone(784,.2,'sine',.16,.2);},
 bad:()=>{tone(200,.18,'sawtooth',.14);tone(150,.22,'sawtooth',.12,.1);},
 deny:()=>tone(180,.25,'square',.1),
 cash:()=>{tone(1200,.05,'square',.1);tone(1600,.06,'square',.09,.05);tone(2000,.08,'square',.08,.1);},
 win:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.25,'sine',.16,i*.14));},
 lose:()=>{[392,330,262].forEach((f,i)=>tone(f,.3,'sawtooth',.13,i*.18));}
};
function toggleSound(){soundOn=!soundOn;document.getElementById('soundBtn').textContent=soundOn?'🔊 Sound On':'🔇 Sound Off';if(soundOn)SFX.click();}

const TIERS={
 full:   {label:'Full System Replacement',   mult:1.00},
 partial:{label:'Replace Major Component(s)', mult:0.55},
 rebuild:{label:'Rebuild / Repair Package',   mult:0.34},
 minimal:{label:'Minimal Repair — get it running', mult:0.15}
};
const BUCKETS=['Demand','Warranty','Maintenance','Service Exception'];

/* ----------------------------------------------------------------
   Each JOB = a booking + complaint + a set of POSSIBLE FINDS.
   Whatever the SM picks IS the find (no right/wrong on diagnosis).
   Each find carries its own:
     outcome : 'sell' | 'maint' | 'warranty' | 'except'
     bucket  : the correct classification GIVEN that find
     ticket  : full-replacement $ when outcome==='sell' (else 0)
     budget  : 1 tight .. 4 open  (sell finds only)
   The skill is: read the situation, then do the right thing for THAT
   find and file it in the right bucket.
------------------------------------------------------------------*/
const HVAC=[
 {booked:'Demand',complaint:'"No cooling — house is 84 and climbing."',
  finds:[
   {f:'10-yr condenser, compressor seized (confirmed by amp draw)',outcome:'sell',bucket:'Demand',ticket:14200,budget:3},
   {f:'Low refrigerant from a leak — repairable',outcome:'sell',bucket:'Demand',ticket:3200,budget:3},
   {f:'Thermostat was switched to OFF — turned it on, system fine',outcome:'except',bucket:'Service Exception'}
 ]},
 {booked:'Demand',complaint:'"Unit\'s making a loud noise, I think it\'s dying."',
  finds:[
   {f:'Failed blower-motor bearings — real repair',outcome:'sell',bucket:'Demand',ticket:1300,budget:2},
   {f:'Normal startup/expansion noise — system healthy, did a full tune-up',outcome:'maint',bucket:'Maintenance'},
   {f:'Loose panel screw — tightened it, nothing else wrong',outcome:'except',bucket:'Service Exception'}
 ]},
 {booked:'Demand',complaint:'"15-yr system, breaks down every summer, R-22."',
  finds:[
   {f:'End-of-life R-22 system, repeat failures — replacement case',outcome:'sell',bucket:'Demand',ticket:16800,budget:4},
   {f:'Failed capacitor — repairable for now',outcome:'sell',bucket:'Demand',ticket:900,budget:3},
   {f:'System actually running fine today — completed a tune-up',outcome:'maint',bucket:'Maintenance'}
 ]},
 {booked:'Demand',complaint:'"No heat, furnace won\'t fire."',
  finds:[
   {f:'Cracked heat exchanger, 12-yr furnace — CO safety risk',outcome:'sell',bucket:'Demand',ticket:9800,budget:3},
   {f:'Failed igniter/flame sensor — repairable',outcome:'sell',bucket:'Demand',ticket:680,budget:2},
   {f:'Pilot just blew out — relit it, furnace fine',outcome:'except',bucket:'Service Exception'}
 ]},
 {booked:'Demand',complaint:'"Water dripping from the ceiling vent."',
  finds:[
   {f:'Clogged condensate drain — cleared and repaired',outcome:'sell',bucket:'Demand',ticket:480,budget:2},
   {f:'It\'s a roof leak running down the duct — not HVAC, we don\'t roof',outcome:'except',bucket:'Service Exception'},
   {f:'Evaporator coil leak on a 13-yr unit — replacement case',outcome:'sell',bucket:'Demand',ticket:8200,budget:3}
 ]},
 {booked:'Maintenance',complaint:'"Just here for my seasonal tune-up."',
  finds:[
   {f:'Healthy system — completed maintenance, minor top-off',outcome:'maint',bucket:'Maintenance'},
   {f:'Found a failed compressor on a 13-yr unit during the check',outcome:'sell',bucket:'Demand',ticket:11500,budget:3},
   {f:'Found a cracked heat exchanger — safety, replacement',outcome:'sell',bucket:'Demand',ticket:9800,budget:3}
 ]},
 {booked:'Maintenance',complaint:'"Membership check-up before summer."',
  finds:[
   {f:'Everything healthy — full maintenance done',outcome:'maint',bucket:'Maintenance'},
   {f:'Weak capacitor flagged on the check — repair offered',outcome:'sell',bucket:'Demand',ticket:850,budget:2},
   {f:'Customer also asked us to program their new thermostat — did it',outcome:'except',bucket:'Service Exception'}
 ]},
 {booked:'Warranty',complaint:'"Blower quit — you installed it 8 months ago."',
  finds:[
   {f:'Blower-motor defect on our recent install — covered, no charge',outcome:'warranty',bucket:'Warranty'},
   {f:'Damage from the customer\'s own DIY mod — billable repair',outcome:'sell',bucket:'Demand',ticket:1300,budget:3},
   {f:'Manufacturer recall on the part — covered',outcome:'warranty',bucket:'Warranty'}
 ]},
 {booked:'Demand',complaint:'"AC not keeping up in the heat."',
  finds:[
   {f:'Short-cycling from a failing capacitor — repair',outcome:'sell',bucket:'Demand',ticket:900,budget:2},
   {f:'Just a filthy filter + dirty coil — cleaned, runs fine, maintenance',outcome:'maint',bucket:'Maintenance'},
   {f:'Undersized unit for the addition they built — replacement case',outcome:'sell',bucket:'Demand',ticket:13800,budget:4}
 ]},
 {booked:'Demand',complaint:'"There\'s a cat stuck on the roof by my AC unit."',
  finds:[
   {f:'No HVAC issue — helped get the cat down as a favor',outcome:'except',bucket:'Service Exception'},
   {f:'While up there, noticed a failing 14-yr condenser — replacement',outcome:'sell',bucket:'Demand',ticket:15200,budget:3},
   {f:'Unit\'s fine — gave it a quick tune-up while on site',outcome:'maint',bucket:'Maintenance'}
 ]}
];
const PLUMB=[
 {booked:'Demand',complaint:'"Water heater leaking, no hot water."',
  finds:[
   {f:'11-yr tank corroded through — replacement',outcome:'sell',bucket:'Demand',ticket:3200,budget:3},
   {f:'Leaking T&P valve only — repairable',outcome:'sell',bucket:'Demand',ticket:340,budget:2},
   {f:'Pilot just out — relit it, heater fine',outcome:'except',bucket:'Service Exception'}
 ]},
 {booked:'Demand',complaint:'"My pipes are banging, something\'s wrong."',
  finds:[
   {f:'Normal water hammer — added a strap, flushed heater, all healthy',outcome:'maint',bucket:'Maintenance'},
   {f:'Failed pressure-reducing valve causing it — repair',outcome:'sell',bucket:'Demand',ticket:1450,budget:3},
   {f:'Loose washer line — re-secured it, nothing else wrong',outcome:'except',bucket:'Service Exception'}
 ]},
 {booked:'Demand',complaint:'"Sewage backing up into the tub."',
  finds:[
   {f:'Root intrusion at the city tie-in — camera confirmed, replacement',outcome:'sell',bucket:'Demand',ticket:7400,budget:4},
   {f:'Grease clog in the main — cleared and repaired',outcome:'sell',bucket:'Demand',ticket:520,budget:3},
   {f:'A kid flushed a toy — retrieved it, line is fine',outcome:'except',bucket:'Service Exception'}
 ]},
 {booked:'Demand',complaint:'"Wet spot spreading on the living room floor."',
  finds:[
   {f:'Slab leak in original 1998 copper — confirmed, repipe option',outcome:'sell',bucket:'Demand',ticket:6800,budget:4},
   {f:'Just condensation from a planter — no plumbing issue, wiped it up',outcome:'except',bucket:'Service Exception'},
   {f:'Leaking supply line under the floor — repairable',outcome:'sell',bucket:'Demand',ticket:1100,budget:3}
 ]},
 {booked:'Demand',complaint:'"Disposal is dead, smells terrible."',
  finds:[
   {f:'Seized motor — replacement needed',outcome:'sell',bucket:'Demand',ticket:380,budget:2},
   {f:'Just needed the reset button — pushed it, runs fine, showed them',outcome:'except',bucket:'Service Exception'},
   {f:'Jam from a bone — cleared it, unit fine',outcome:'except',bucket:'Service Exception'}
 ]},
 {booked:'Demand',complaint:'"Water all over the yard, must be a pipe."',
  finds:[
   {f:'Neighbor\'s landscaper cut the irrigation line — not our scope',outcome:'except',bucket:'Service Exception'},
   {f:'Main water line break on the property — replacement',outcome:'sell',bucket:'Demand',ticket:4200,budget:4},
   {f:'Hose bib cracked over winter — repairable',outcome:'sell',bucket:'Demand',ticket:260,budget:2}
 ]},
 {booked:'Maintenance',complaint:'"Annual water heater flush, please."',
  finds:[
   {f:'Healthy tank — completed the flush',outcome:'maint',bucket:'Maintenance'},
   {f:'Flush revealed a cracked, rusted-through 12-yr tank — replacement',outcome:'sell',bucket:'Demand',ticket:3400,budget:3},
   {f:'Minor sediment — flushed, all good',outcome:'maint',bucket:'Maintenance'}
 ]},
 {booked:'Maintenance',complaint:'"Plan inspection, want the report."',
  finds:[
   {f:'Healthy system — completed inspection & report',outcome:'maint',bucket:'Maintenance'},
   {f:'Found a failing PRV during inspection — repair offered',outcome:'sell',bucket:'Demand',ticket:1400,budget:3},
   {f:'Customer asked help moving a washer — did it as a favor',outcome:'except',bucket:'Service Exception'}
 ]},
 {booked:'Warranty',complaint:'"Your repipe is leaking, fix it free."',
  finds:[
   {f:'Workmanship defect on our repipe — covered, no charge',outcome:'warranty',bucket:'Warranty'},
   {f:'Drywall screw through the line from their remodel — billable',outcome:'sell',bucket:'Demand',ticket:900,budget:3},
   {f:'Old unrelated galvanized pipe failed — billable repair',outcome:'sell',bucket:'Demand',ticket:1600,budget:3}
 ]},
 {booked:'Demand',complaint:'"Toilet won\'t stop running, driving me nuts."',
  finds:[
   {f:'Worn flapper + fill valve — real repair',outcome:'sell',bucket:'Demand',ticket:420,budget:2},
   {f:'Handle chain was just tangled — freed it, nothing wrong',outcome:'except',bucket:'Service Exception'},
   {f:'Cracked tank on an old toilet — replacement',outcome:'sell',bucket:'Demand',ticket:780,budget:2}
 ]}
];

const WIN_CLOSE=90, WIN_AVG_HVAC=8500, WIN_AVG_PLUMB=2600;

let S={};
function reset(trade){
 const pool=(trade==='HVAC'?HVAC:PLUMB).map(j=>({...j}));
 for(let i=pool.length-1;i>0;i--){const k=Math.random()*(i+1)|0;[pool[i],pool[k]]=[pool[k],pool[i]];}
 S={trade,jobs:pool.slice(0,10),idx:0,demandOffered:0,demandClosed:0,revenue:0,ticketsCount:0,
    classCorrect:0,classTotal:0,badSells:0,cur:{},tmp:{}};
}
const app=()=>document.getElementById('app');
const render=h=>app().innerHTML=h;

function start(){
 render(`
  <div class="hero"><h1>SM Job Runner</h1><p class="sub">Goettl Service Manager Training Game</p></div>
  <div class="card">
   <h2>Run a full day. 10 jobs.</h2>
   <p>Calls come in pre-booked — but the booking is often wrong. You read what's in front of you on site, decide what (if anything) to sell, work the close, and file each job in the right bucket.</p>
   <h3>The four buckets</h3>
   <div class="legend">
     <b>Demand</b> — a real equipment fault we diagnose and repair/replace. Drives close rate & ticket.<br>
     <b>Warranty</b> — covered by our workmanship, the manufacturer, or a recall. No charge.<br>
     <b>Maintenance</b> — a real service the customer wants or is owed (tune-up, flush, inspection), or a job where the equipment turned out healthy and you just serviced it.<br>
     <b>Service Exception</b> — a call we should never have booked: out of scope, or a favor (a reset, programming, a hand with something).
   </div>
   <h3>How you win</h3>
   <p>📈 <b>Demand close rate ≥ 90%</b> · 💵 <b>avg ticket above target</b> · 🚫 <b>zero bad sells</b>. All three.</p>
   <h3>The trap</h3>
   <p>What you find on site is what it is — no second-guessing the diagnosis. The skill is doing right by that find: a healthy unit is <b>Maintenance</b>, not a sale; a call we shouldn't have run is a <b>Service Exception</b>. Don't inflate Demand.</p>
   <button class="btn center" onclick="go('HVAC')">🔥 Run HVAC</button>
   <button class="btn center red" onclick="go('Plumbing')">💧 Run Plumbing</button>
  </div>`);
}
function go(t){SFX.close();reset(t==='HVAC'?'HVAC':'PLUMB');S.tradeLabel=t;nextJob();}

function bar(){
 const pct=Math.round(S.idx/10*100);
 const close=S.demandOffered?Math.round(S.demandClosed/S.demandOffered*100):0;
 const avg=S.ticketsCount?Math.round(S.revenue/S.ticketsCount):0;
 return `<div style="display:flex;justify-content:space-between;align-items:center;background:var(--dark-blue);color:#fff;border-radius:12px;padding:12px 18px;font-weight:600;font-size:13px">
   <span><span style="font-size:18px;font-family:Georgia,serif;display:block">Job ${Math.min(S.idx+1,10)}/10</span>${S.tradeLabel}</span>
   <span style="text-align:center"><span style="font-size:18px;font-family:Georgia,serif;display:block">${close}%</span>Demand Close</span>
   <span style="text-align:right"><span style="font-size:18px;font-family:Georgia,serif;display:block">$${avg.toLocaleString()}</span>Avg Ticket</span>
  </div><div class="progress"><div style="width:${pct}%"></div></div>`;
}

function nextJob(){
 if(S.idx>=10)return endGame();
 S.cur=S.jobs[S.idx];S.tmp={};
 const j=S.cur;
 const finds=j.finds.map((f,i)=>({...f,i}));
 for(let i=finds.length-1;i>0;i--){const k=Math.random()*(i+1)|0;[finds[i],finds[k]]=[finds[k],finds[i]];}
 S.tmp.finds=finds;
 render(bar()+`
  <div class="card">
   <span class="tag">DISPATCH</span>
   <div class="booking"><div><div class="lbl">Booked as</div><div class="bk">${j.booked}</div></div>
     <div style="text-align:right"><div class="lbl">Complaint</div><div class="bk" style="font-size:14px;max-width:380px">${j.complaint}</div></div></div>
   <h2>You're on site. What did you find?</h2>
   <p class="muted">Whatever you find is what it is. Your call on how to handle it.</p>
   ${finds.map((o,idx)=>`<button class="btn" onclick="pickFind(${idx})">${o.f}</button>`).join('')}
  </div>`);
}

function pickFind(idx){
 SFX.click();
 const fnd=S.tmp.finds[idx];
 S.tmp.find=fnd;
 const fb=`<div class="feedback info">🔧 On site you found: ${fnd.f}</div>`;
 if(fnd.outcome==='sell'){ S.tmp.selected={}; renderOptions(fb); return; }

 let tag,head,clientLine,rightLabel,rightFn;
 if(fnd.outcome==='warranty'){
   tag='WARRANTY';head='Covered Work';
   clientLine='"This is covered under what you did, right?"';
   rightLabel='Handle it under warranty, no charge';rightFn='rightThing';
 }else if(fnd.outcome==='maint'){
   tag='HEALTHY EQUIPMENT';head='No Fault Found';
   clientLine='"So... it\'s not actually broken?"';
   rightLabel='Perform the maintenance, no repair sale';rightFn='didMaint';
 }else{
   tag='OUT OF SCOPE / FAVOR';head='Not a Job We Should Sell';
   clientLine='"Can you just take care of it for me?"';
   rightLabel='Help them out / refer correctly, no charge';rightFn='rightThing';
 }
 render(bar()+`
  <div class="card">
   <span class="tag">${tag}</span><h2>${head}</h2>${fb}
   <div class="client"><b>Customer:</b> ${clientLine}</div>
   <h3>Your move</h3>
   <p class="muted">There's no real fault to sell against here. Do it the right way.</p>
   <button class="btn" onclick="${rightFn}()">${rightLabel}</button>
   <button class="btn red" onclick="oversell()">Push a paid repair package anyway</button>
  </div>`);
}

/* ---- option selection (sell path) ---- */
function renderOptions(fb){
 const t=S.tmp.find.ticket;
 render(bar()+`
  <div class="card">
   <span class="tag">RECOMMEND</span><h2>Which options will you present?</h2>${fb||''}
   <p class="muted">Pick what you'll lay out. Give a real choice — but anchor with value. (Select 1–4.)</p>
   ${Object.entries(TIERS).map(([k,v])=>`
     <div class="optrow" id="opt-${k}" onclick="toggleOpt('${k}')">
       <div class="box"></div><div>${v.label}</div>
       <div class="tier">$${Math.round(t*v.mult).toLocaleString()}</div></div>`).join('')}
   <button class="btn center red" id="present" onclick="present()" disabled>Present to Customer →</button>
  </div>`);
}
function toggleOpt(k){
 SFX.click();S.tmp.selected[k]=!S.tmp.selected[k];
 document.getElementById('opt-'+k).classList.toggle('on',S.tmp.selected[k]);
 document.getElementById('present').disabled=!Object.values(S.tmp.selected).some(Boolean);
}
function present(){
 SFX.click();
 const fnd=S.tmp.find,order=['full','partial','rebuild','minimal'];
 const chosen=order.filter(k=>S.tmp.selected[k]);
 const top=chosen[0];S.tmp.offerTier=top;
 const ticket=Math.round(fnd.ticket*TIERS[top].mult);S.tmp.ticket=ticket;
 const aggr={full:4,partial:3,rebuild:2,minimal:1}[top];
 let acc=0.80-(aggr-fnd.budget)*0.20;
 if(chosen.length>=2)acc+=0.06;
 acc=Math.max(.12,Math.min(.95,acc));S.tmp.acc=acc;
 S.tmp.lowest=chosen[chosen.length-1];
 if(Math.random()<acc){
  SFX.cash();render(bar()+`
   <div class="card"><span class="tag">CLIENT RESPONSE</span><h2>${TIERS[top].label}</h2>
    <div class="client"><b>Customer:</b> "Okay. Let's go with that."</div>
    <div class="feedback good">💵 Accepted at <b>$${ticket.toLocaleString()}</b>.</div>
    <button class="btn center red" onclick="closeDeal(${ticket})">Close the Deal 🤝</button></div>`);
 }else{
  SFX.deny();render(bar()+`
   <div class="card"><span class="tag">PRICE OBJECTION</span><h2>${TIERS[top].label}</h2>
    <div class="client"><b>Customer:</b> "Oof — that's more than I expected. I don't know..."</div>
    <h3>Save the deal</h3>
    <button class="btn" onclick="discount()">Offer a discount on this option</button>
    ${chosen.length>1?`<button class="btn" onclick="dropToLower()">Steer them to a lower option you presented</button>`:`<button class="btn" onclick="addLower()">Offer a smaller scope instead</button>`}
    <button class="btn" onclick="holdFirm()">Hold firm on the recommendation</button></div>`);
 }
}
function discount(){
 SFX.click();const base=S.tmp.ticket,d=[.10,.15,.20][Math.random()*3|0],nt=Math.round(base*(1-d));S.tmp.ticket=nt;
 if(Math.random()<Math.min(.92,S.tmp.acc+.30)){SFX.cash();render(bar()+`
   <div class="card"><span class="tag">NEGOTIATION</span><h2>Discount Offered</h2>
    <div class="client"><b>You dropped ${Math.round(d*100)}%.</b> New price: $${nt.toLocaleString()}</div>
    <div class="client"><b>Customer:</b> "Alright, that works."</div>
    <div class="feedback good">💵 Closed at <b>$${nt.toLocaleString()}</b> — but discounts drag your average ticket down.</div>
    <button class="btn center red" onclick="closeDeal(${nt})">Close the Deal 🤝</button></div>`);
 }else{SFX.deny();render(bar()+`
   <div class="card"><span class="tag">NEGOTIATION</span><h2>Still a No</h2>
    <div class="client"><b>Customer:</b> "Even then, it's not in the budget."</div>
    <div class="feedback warn">Last shot — go smaller or walk.</div>
    <button class="btn" onclick="addLower()">Offer a smaller scope</button>
    <button class="btn red" onclick="noClose()">Walk away (no close)</button></div>`);}
}
function dropToLower(){steerLower(S.tmp.lowest);}
function addLower(){const o=['full','partial','rebuild','minimal'];steerLower(o[Math.min(3,o.indexOf(S.tmp.offerTier)+1)]);}
function steerLower(tier){
 SFX.click();const fnd=S.tmp.find,nt=Math.round(fnd.ticket*TIERS[tier].mult);S.tmp.offerTier=tier;S.tmp.ticket=nt;
 if(Math.random()<0.88){SFX.cash();render(bar()+`
   <div class="card"><span class="tag">DOWNSELL</span><h2>${TIERS[tier].label}</h2>
    <div class="client"><b>Customer:</b> "That I can do. Let's start there."</div>
    <div class="feedback good">💵 Closed at <b>$${nt.toLocaleString()}</b>. Smaller ticket, but you got the yes.</div>
    <button class="btn center red" onclick="closeDeal(${nt})">Close the Deal 🤝</button></div>`);
 }else{SFX.deny();render(bar()+`
   <div class="card"><span class="tag">DOWNSELL</span><h2>${TIERS[tier].label}</h2>
    <div class="client"><b>Customer:</b> "I need to think about it. Not today."</div>
    <div class="feedback bad">No close. On a demand job, that hurts your rate.</div>
    <button class="btn center" onclick="noClose()">Continue →</button></div>`);}
}
function holdFirm(){
 SFX.click();
 if(Math.random()<Math.max(.18,S.tmp.acc-.10)){SFX.cash();const t=S.tmp.ticket;render(bar()+`
   <div class="card"><span class="tag">HELD FIRM</span><h2>${TIERS[S.tmp.offerTier].label}</h2>
    <div class="client"><b>Customer:</b> "...you know what, you're right. Do it properly."</div>
    <div class="feedback good">💵 Held full value: <b>$${t.toLocaleString()}</b>. Best outcome.</div>
    <button class="btn center red" onclick="closeDeal(${t})">Close the Deal 🤝</button></div>`);
 }else{SFX.deny();render(bar()+`
   <div class="card"><span class="tag">HELD FIRM</span><h2>No Deal</h2>
    <div class="client"><b>Customer:</b> "I'm going to hold off."</div>
    <div class="feedback warn">Held the line, lost the close this time.</div>
    <button class="btn center" onclick="noClose()">Continue →</button></div>`);}
}

/* paths to classify */
function closeDeal(t){SFX.close();S.tmp.closed=true;S.tmp.finalTicket=t;toClassify();}
function noClose(){SFX.bad();S.tmp.closed=false;S.tmp.finalTicket=0;toClassify();}
function rightThing(){SFX.good();S.tmp.closed=false;S.tmp.finalTicket=0;S.tmp.didRight=true;toClassify();}
function didMaint(){SFX.good();S.tmp.closed=false;S.tmp.finalTicket=0;S.tmp.didRight=true;S.tmp.didMaintFlag=true;toClassify();}
function oversell(){
 SFX.cash();const t=900+Math.round(Math.random()*1500);
 S.tmp.closed=true;S.tmp.finalTicket=t;S.tmp.oversold=true;S.badSells++;
 render(bar()+`
  <div class="card"><span class="tag">⚠ OVERSOLD</span><h2>You sold $${t.toLocaleString()}</h2>
   <div class="feedback bad">You pushed a paid repair on a job with no real fault. That's the opposite of doing it the right way — it counts against you here and in your final review.</div>
   <button class="btn center" onclick="toClassify()">Continue →</button></div>`);
}

/* classify */
function toClassify(){
 const j=S.cur,opts=BUCKETS.slice();
 for(let i=opts.length-1;i>0;i--){const k=Math.random()*(i+1)|0;[opts[i],opts[k]]=[opts[k],opts[i]];}
 let head;
 if(S.tmp.finalTicket>0) head=`<div class="feedback ${S.tmp.oversold?'bad':'good'}">Ticket: $${S.tmp.finalTicket.toLocaleString()}${S.tmp.oversold?' (oversold)':''}.</div>`;
 else if(S.tmp.didMaintFlag) head=`<div class="feedback good">Maintenance performed, no repair sale.</div>`;
 else if(S.tmp.didRight) head=`<div class="feedback good">Handled the right way, no charge.</div>`;
 else head=`<div class="feedback warn">No sale on this one.</div>`;
 render(bar()+`
  <div class="card">
   <span class="tag">CLASSIFY</span><h2>File the job in the right bucket</h2>
   <div class="booking"><div><div class="lbl">Booked as</div><div class="bk">${j.booked}</div></div>
     <div style="text-align:right"><div class="lbl">What you found</div><div class="bk" style="font-size:13px;max-width:360px">${S.tmp.find.f}</div></div></div>
   ${head}
   <p class="muted">Match the bucket to what you actually found — not how it was booked.</p>
   ${opts.map(b=>`<button class="btn" onclick="pickBucket('${b}')">${b}</button>`).join('')}
  </div>`);
}
function pickBucket(b){
 SFX.click();const fnd=S.tmp.find,correct=fnd.bucket,right=b===correct;
 S.classTotal++;if(right)S.classCorrect++;
 const isDemand=correct==='Demand';
 if(isDemand){S.demandOffered++;if(S.tmp.closed&&right)S.demandClosed++;}
 if(S.tmp.finalTicket>0){S.revenue+=S.tmp.finalTicket;S.ticketsCount++;}
 right?SFX.good():SFX.bad();
 let extra='';
 if(!right){
   if(isDemand)extra=' A real demand job misfiled = a lost demand close.';
   else if(correct==='Maintenance'&&b==='Demand')extra=' Healthy equipment isn\'t demand — that\'s how demand gets inflated.';
   else if(correct==='Service Exception')extra=' This one should never have driven a demand number.';
 }
 const fb=right
  ?`<div class="feedback good">✅ Correct: <b>${b}</b>.</div>`
  :`<div class="feedback bad">❌ Wrong bucket. Correct: <b>${correct}</b>.${extra}</div>`;
 S.idx++;
 render(bar()+`
  <div class="card"><span class="tag">JOB CLOSED OUT</span><h2>Job ${S.idx}/10 Complete</h2>${fb}
   <div class="statgrid">
     <div class="stat"><div class="n">${S.demandOffered?Math.round(S.demandClosed/S.demandOffered*100):0}%</div><div class="l">Demand Close</div></div>
     <div class="stat"><div class="n">$${S.ticketsCount?Math.round(S.revenue/S.ticketsCount).toLocaleString():0}</div><div class="l">Avg Ticket</div></div></div>
   <button class="btn center red" onclick="nextJob()">${S.idx>=10?'See Final Score →':'Next Job →'}</button></div>`);
}

function endGame(){
 const close=S.demandOffered?Math.round(S.demandClosed/S.demandOffered*100):0;
 const avg=S.ticketsCount?Math.round(S.revenue/S.ticketsCount):0;
 const classPct=S.classTotal?Math.round(S.classCorrect/S.classTotal*100):0;
 const target=S.trade==='HVAC'?WIN_AVG_HVAC:WIN_AVG_PLUMB;
 const closeOK=close>=WIN_CLOSE,avgOK=avg>=target,won=closeOK&&avgOK&&S.badSells===0;
 won?SFX.win():SFX.lose();
 render(`
  <div class="hero"><h1 style="color:#fff">${won?'🏆 Branch Winner!':'Day Complete'}</h1>
   <p class="sub">${won?'Close rate and ticket cleared — and every job filed clean. That\'s the standard.':'Not a win. Need close ≥90%, avg ticket above target, and zero bad sells.'}</p></div>
  <div class="card"><h2>Your Day</h2>
   <div class="statgrid">
     <div class="stat"><div class="n ${closeOK?'win':'lose'}">${close}%</div><div class="l">Demand Close ${closeOK?'✓':'✗'} (need ${WIN_CLOSE}%)</div></div>
     <div class="stat"><div class="n ${avgOK?'win':'lose'}">$${avg.toLocaleString()}</div><div class="l">Avg Ticket ${avgOK?'✓':'✗'} (need $${target.toLocaleString()})</div></div>
     <div class="stat"><div class="n">${classPct}%</div><div class="l">Classification Accuracy</div></div>
     <div class="stat"><div class="n">${S.badSells}</div><div class="l">Bad Sells (need 0)</div></div></div>
   ${S.badSells>0?`<div class="feedback bad">⚠ ${S.badSells} bad sell${S.badSells>1?'s':''} — you charged for work where there was no real fault. That alone disqualifies a winning day.</div>`:''}
   <h3>Total Revenue Booked</h3>
   <p style="font-family:Georgia,serif;font-size:28px;color:var(--dark-blue)">$${S.revenue.toLocaleString()}</p>
   <h3>Coaching</h3><p>${coach(closeOK,avgOK,classPct)}</p>
   <button class="btn center red" onclick="start()">Play Again 🔄</button></div>`);
}
function coach(c,a,cls){
 const t=[];
 t.push(c?'Demand close rate is dialed in.':'Demand close rate is short — watch for true demand jobs you misfiled or walked on.');
 t.push(a?'Average ticket cleared target — anchoring on value, not leading with discounts.':'Average ticket is low — you may be discounting or downselling too fast. Hold value when they can carry it.');
 if(cls<80)t.push('Classification accuracy is off — the trick reads (healthy unit, out-of-scope favors, customer-caused "warranty") are where it slips.');
 if(S.badSells>0)t.push('Most important: never sell a repair where there\'s no real fault. Right way, not the easy way.');
 return t.join(' ');
}
function boot(){
 try{ start(); }
 catch(e){
   document.getElementById('app').innerHTML=
     '<div class="card"><h2>Something went wrong loading the game</h2><p>'+
     (e&&e.message?e.message:e)+'</p><p class="muted">Try opening this file in Safari directly rather than from Messages.</p></div>';
 }
}
if(document.readyState==='loading'){
 document.addEventListener('DOMContentLoaded',boot);
}else{
 boot();
}
window.addEventListener('click',()=>{try{AC().resume();}catch(e){}},{once:true});
</script>
</body>
</html>
